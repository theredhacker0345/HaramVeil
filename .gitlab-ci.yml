# HaramVeil CI — kept deliberately lean to conserve GitLab pipeline minutes.
#
# Execution image: ci/Dockerfile builds ci-android:36-jdk21 (JDK 21 + Android
# SDK 36) into this project's container registry via the `prepare-ci-image`
# job — automatic whenever ci/Dockerfile changes, manual otherwise. Jobs use
# that image directly: no SDK download, no apt installs, no .android-sdk cache.
#
# On push to main:
#   - one `verify` job (detekt + fossOnnx unit tests + mlkit compile check in a
#     single Gradle invocation), SKIPPED entirely when the commit only touches
#     docs/metadata (no pipeline minutes spent). Unit tests live in the shared
#     main source set, so the mlkit flavor is verified by compilation instead of
#     re-running identical tests.
#   - NO APK builds on push. Each flavor's release build is a MANUAL job — press
#     the play button next to it in the pipeline view (or Run pipeline).
image:
  name: "$CI_IMAGE"

workflow:
  rules:
    # Main pushes: verify (skipped for docs-only commits) + manual APK builds.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    # Manual "Run pipeline" (web) / schedules: full control from the UI.
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # Merge requests: verify only, no APK builds.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

default:
  interruptible: true

variables:
  CI_IMAGE: "$CI_REGISTRY_IMAGE/ci-android:36-jdk21"
  GIT_DEPTH: "1"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  # Avoids Gradle building heavy watching infrastructure in ephemeral CI containers.
  GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"

cache:
  key: haramveil-gradle-v1
  paths:
    - .gradle/caches/
    - .gradle/wrapper/

# Files that can affect build/test outcomes. A commit touching anything else
# (docs, metadata, licenses…) skips the verify job and its pipeline minutes.
.code-paths: &code-paths
  - "**/*.kt"
  - "**/*.kts"
  - "**/*.xml"
  - "**/*.pro"
  - "**/*.toml"
  - "gradle/**"
  - "gradlew"
  - "gradlew.bat"
  - "app/src/main/assets/**"
  - "app/src/fossOnnx/assets/**"
  - "config/detekt/**"
  - ".gitlab-ci.yml"

prepare-ci-image:
  stage: setup
  image: docker:27
  services:
    - docker:27-dind
  needs: []
  timeout: 30m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - "ci/Dockerfile"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "ci/Dockerfile"
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"'
      when: manual
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker build -f ci/Dockerfile -t "$CI_IMAGE" .
    - docker push "$CI_IMAGE"

verify:
  stage: verify
  timeout: 20m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes: *code-paths
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *code-paths
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"'
  script:
    # One Gradle invocation for everything: a single configuration phase.
    # The unit tests are in the shared main source set, so running them once
    # (fossOnnx) covers both flavors; the mlkit flavor is verified by compiling
    # it, which is much cheaper than re-running identical tests.
    - ./gradlew --no-daemon :app:detekt :app:testFossOnnxDebugUnitTest :app:compileMlkitDebugKotlin
  artifacts:
    when: always
    reports:
      junit:
        - app/build/test-results/testFossOnnxDebugUnitTest/*.xml
    expire_in: 1 week

# MANUAL ONLY — never runs on push. Per flavor so you build only what you need.
# Produces R8-minified per-ABI release APKs (arm64-v8a / armeabi-v7a / x86_64 /
# universal). needs: [] lets a build start immediately, in parallel with verify.
build-apks-fossonnx:
  stage: build
  needs: []
  timeout: 45m
  resource_group: release-apks
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"'
      when: manual
  script:
    # arm64-v8a only: the ~26 MB ONNX runtime is bundled once per ABI, so a
    # single-ABI build is ~52 MB instead of a ~139 MB universal APK.
    - ./gradlew --no-daemon -Pabi=arm64-v8a :app:assembleFossOnnxRelease
  artifacts:
    paths:
      - app/build/outputs/apk/fossOnnx/release/*.apk
    expire_in: 7 days

build-apks-mlkit:
  stage: build
  needs: []
  timeout: 45m
  resource_group: release-apks
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"'
      when: manual
  script:
    - ./gradlew --no-daemon -Pabi=arm64-v8a :app:assembleMlkitRelease
  artifacts:
    paths:
      - app/build/outputs/apk/mlkit/release/*.apk
    expire_in: 7 days

stages:
  - setup
  - verify
  - build
