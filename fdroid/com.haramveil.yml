MaintainerNotes: |
  This app is built using the fossOnnx flavor, which excludes all proprietary
  dependencies (Google Play Services, ML Kit). Only FOSS libraries are used.

  The app bundles one ONNX model (320n.onnx, 12 MB) in src/main/assets/. This is
  a NudeNet v3.4 weight file from https://github.com/notAI-tech/NudeNet/releases/tag/v3.4-weights
  The upstream repository is AGPL-3.0 licensed. The weight file is a pre-trained
  neural network (data, not executable code) and is treated as a data asset.
  scanignore is used to suppress F-Droid's binary scanner for this file.

  The larger 640m.onnx (99 MB) model is NOT bundled in the APK. Instead, users
  who want the "Enhanced" model download it themselves via their browser and
  import it via the Android file picker (Storage Access Framework). This keeps
  the APK small (164 MB instead of 263 MB) and preserves the no-INTERNET-permission
  guarantee — the app never connects to the network; the user's browser does.

  The hadiths_ayahs.json asset contains Quranic verses and Hadith text which
  are centuries-old public domain religious texts.

  The Amiri font (amiri_regular.ttf) is licensed under the SIL Open Font
  License (OFL) 1.1 — see https://github.com/aliftype/amiri

  The ModelDownloadManager.kt contains code to download a RapidOCR model from
  modelscope.cn at runtime, but this code path is dead in the fossOnnx release
  build because the INTERNET permission is stripped via the release manifest
  (app/src/release/AndroidManifest.xml uses tools:node="remove"). The download
  URL is retained in source for debug-build convenience only.

  No API keys, no tracking, no analytics, no advertising. All processing is
  on-device.

