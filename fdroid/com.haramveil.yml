# F-Droid build metadata for HaramVeil.
#
# This file is a template for the entry that must be added to the
# fdroiddata repository (https://gitlab.com/fdroid/fdroiddata) as
# metadata/com.haramveil.yml when submitting the app for inclusion.
Categories:
  - Security
  - Internet
License: GPL-3.0-or-later
AuthorName: Ubaid ur Rehman
WebSite: https://gitlab.com/theredhacker0345/HaramVeil
SourceCode: https://gitlab.com/theredhacker0345/HaramVeil
IssueTracker: https://gitlab.com/theredhacker0345/HaramVeil/-/issues
Changelog: https://gitlab.com/theredhacker0345/HaramVeil/-/releases
AutoName: HaramVeil
RepoType: git
Repo: https://gitlab.com/theredhacker0345/HaramVeil.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: COMMIT_HASH_PLACEHOLDER
    subdir: app
    gradle:
      - fossOnnx
    gradleprops:
      - fdroidBuild
    output: build/outputs/apk/fossOnnx/release/*.apk
    scanignore:
      # Pre-trained model weights: data assets, not executables.
      - src/main/assets/320n.onnx
      - src/fossOnnx/assets/en_PP-OCRv5_rec.onnx
      # Bundled font (SIL OFL 1.1).
      - src/main/res/font/amiri_regular.ttf

MaintainerNotes: |
  The fossOnnx flavor is the only FOSS-clean build: it has no Google Play
  Services / ML Kit dependency, and release builds strip the INTERNET
  permission (app/src/release/AndroidManifest.xml, tools:node="remove").
  -PfdroidBuild disables ABI splits so the build yields exactly one
  universal APK.

  Bundled AI assets (data, not executable code):
  - src/main/assets/320n.onnx — NudeNet v3.4 detector weights (~12 MB),
    https://github.com/notAI-tech/NudeNet/releases/tag/v3.4-weights
    (upstream repo is AGPL-3.0; weights redistributed as data assets —
    see LICENSES.md and NOTICE in the source repo for the discussion).
  - src/fossOnnx/assets/en_PP-OCRv5_rec.onnx + ppocrv5_en_dict.txt —
    PP-OCRv5 English OCR model + dictionary (~8 MB), Apache-2.0, from
    https://github.com/RapidAI/RapidOCR (v3.7.0) / PaddleOCR.
  - src/main/res/font/amiri_regular.ttf — Amiri font, SIL OFL 1.1.

  The 640m detector is NOT bundled; users import it themselves via the
  file picker, so the app never downloads anything (no INTERNET permission).

  ModelDownloadManager.kt retains an optional model-update download path,
  but that code is unreachable in release builds because the INTERNET
  permission is stripped; it exists for local debug builds only.

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
