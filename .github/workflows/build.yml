name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GRADLE_OPTS: "-Xmx3072m"

jobs:
  build-foss:
    runs-on: ubuntu-latest
    # fossOnnx flavour is fully FOSS and F-Droid eligible.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle.properties', '**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Assemble fossOnnx release
        run: ./gradlew :app:assembleFossOnnxRelease

      - name: Lint fossOnnx release
        run: ./gradlew :app:lintFossOnnxRelease

      - name: Upload fossOnnx release APK
        uses: actions/upload-artifact@v4
        with:
          name: haramveil-fossOnnx-release
          path: app/build/outputs/apk/fossOnnx/release/
          if-no-files-found: error

  build-mlkit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle.properties', '**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Assemble mlkit release
        run: ./gradlew :app:assembleMlkitRelease

      - name: Lint mlkit release
        run: ./gradlew :app:lintMlkitRelease

      - name: Upload mlkit release APK
        uses: actions/upload-artifact@v4
        with:
          name: haramveil-mlkit-release
          path: app/build/outputs/apk/mlkit/release/
          if-no-files-found: error
