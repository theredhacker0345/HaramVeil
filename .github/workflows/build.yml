name: Android CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  GRADLE_OPTS: "-Xmx3072m"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build fossOnnx Release
        run: ./gradlew :app:assembleFossOnnxRelease

      - name: Build mlkit Release
        run: ./gradlew :app:assembleMlkitRelease

      - name: Prepare APKs
        run: |
          mkdir -p release-artifacts
          # Find and rename the APKs to be more descriptive
          find app/build/outputs/apk/fossOnnx/release/ -name "*.apk" -exec cp {} release-artifacts/HaramVeil-fossOnnx-release.apk \;
          find app/build/outputs/apk/mlkit/release/ -name "*.apk" -exec cp {} release-artifacts/HaramVeil-mlkit-release.apk \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HaramVeil-APKs
          path: release-artifacts/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/HaramVeil-fossOnnx-release.apk
            release-artifacts/HaramVeil-mlkit-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
