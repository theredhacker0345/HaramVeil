name: Android CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  GRADLE_OPTS: "-Xmx3072m -Dorg.gradle.daemon=false"

permissions:
  contents: write

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run Android Lint (fossOnnx)
        run: ./gradlew lintFossOnnxDebug

      - name: Run Android Lint (mlkit)
        run: ./gradlew lintMlkitDebug

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit Tests
        run: ./gradlew testFossOnnxDebugUnitTest testMlkitDebugUnitTest

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/build/test-results/**/*.xml'

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/**/*.xml

  build:
    name: Build Flavor (${{ matrix.flavor }})
    needs: [static-analysis, unit-tests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - flavor: fossOnnx
          task: assembleFossOnnxRelease
          apk_dir: fossOnnx
        - flavor: mlkit
          task: assembleMlkitRelease
          apk_dir: mlkit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          add-job-summary: 'on'

      - name: Build ${{ matrix.flavor }} Release
        run: ./gradlew :app:${{ matrix.task }} --no-daemon

      - name: Get APK path
        id: apk-path
        run: |
          APK_PATH=$(find app/build/outputs/apk/${{ matrix.apk_dir }}/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found in app/build/outputs/apk/${{ matrix.apk_dir }}/release/"
            exit 1
          fi
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "filename=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT

      - name: Generate Checksum
        run: |
          sha256sum "${{ steps.apk-path.outputs.path }}" > "${{ steps.apk-path.outputs.path }}.sha256"

      - name: APK Size Check
        run: |
          size=$(du -h "${{ steps.apk-path.outputs.path }}" | cut -f1)
          echo "### APK Size (${{ matrix.flavor }}): $size" >> $GITHUB_STEP_SUMMARY

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HaramVeil-${{ matrix.flavor }}-APK
          path: |
            ${{ steps.apk-path.outputs.path }}
            ${{ steps.apk-path.outputs.path }}.sha256

  dependency-scan:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  release:
    name: Create Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: HaramVeil-*-APK
          merge-multiple: true

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp artifacts/*.apk release-assets/
          cp artifacts/*.sha256 release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
