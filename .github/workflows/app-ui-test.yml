name: App UI Test (Emulator)

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor to test (fossOnnx or mlkit)'
        required: false
        default: 'fossOnnx'
  pull_request:
    branches: [main]
    paths:
      - 'app/src/**'
      - '.github/workflows/app-ui-test.yml'

env:
  GRADLE_OPTS: "-Xmx3072m -Dorg.gradle.daemon=false"

jobs:
  emulator-test:
    name: Emulator UI Test (${{ github.event.inputs.flavor || 'fossOnnx' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Enable KVM (required for emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Build ${{ github.event.inputs.flavor || 'fossOnnx' }} debug APK
        env:
          FLAVOR: ${{ github.event.inputs.flavor || 'fossOnnx' }}
        run: |
          # Capitalize first letter for the Gradle task name
          FLAVOR_CAP="$(printf '%s' "$FLAVOR" | sed 's/^./\U&/')"
          ./gradlew :app:assemble${FLAVOR_CAP}Debug --no-daemon

      - name: Find APK
        id: apk
        env:
          FLAVOR: ${{ github.event.inputs.flavor || 'fossOnnx' }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/${FLAVOR}/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found"
            exit 1
          fi
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Run emulator + install + interact + screenshot
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_6
          sdcard-path-or-size: 512M
          heap-size: 512M
          ram-size: 2048M
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            echo "=== Creating screenshots directory ==="
            mkdir -p screenshots

            echo "=== Waiting for boot ==="
            adb wait-for-device
            adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
            echo "=== Boot complete! ==="

            echo "=== Device info ==="
            adb shell getprop ro.product.model
            adb shell getprop ro.build.version.release
            adb shell wm size

            echo "=== Installing APK ==="
            adb install -r -g "$APK_PATH"

            echo "=== Installed packages (haramveil) ==="
            adb shell pm list packages | grep haramveil

            echo "=== Clearing logcat ==="
            adb logcat -c

            echo "=== Launching HaramVeil app ==="
            adb shell am start -n com.haramveil/.MainActivity
            sleep 10

            echo "=== Screenshot 1: App launched (onboarding Step 1) ==="
            adb shell screencap -p /sdcard/screen1.png
            adb pull /sdcard/screen1.png screenshots/01_launch.png

            echo "=== UI dump 1 ==="
            adb shell uiautomator dump /sdcard/ui1.xml
            adb pull /sdcard/ui1.xml screenshots/ui1_launch.xml

            echo "=== Current focused activity ==="
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | head -2

            echo "=== Tapping 'Begin Setup' button (human-like) ==="
            adb shell uiautomator dump /sdcard/ui_tmp.xml
            adb pull /sdcard/ui_tmp.xml /tmp/ui_tmp.xml
            COORDS=$(python3 .github/scripts/find_element.py /tmp/ui_tmp.xml "Begin Setup" || true)
            [ -n "$COORDS" ] && echo ">>> Tapping 'Begin Setup' at $COORDS" && adb shell input tap $COORDS || echo ">>> Could not find 'Begin Setup' button"
            sleep 5

            echo "=== Screenshot 2: After tapping Begin Setup ==="
            adb shell screencap -p /sdcard/screen2.png
            adb pull /sdcard/screen2.png screenshots/02_after_begin_setup.png
            adb shell uiautomator dump /sdcard/ui2.xml
            adb pull /sdcard/ui2.xml screenshots/ui2_after_begin.xml

            echo "=== Tapping 'Continue' or 'Next' if present ==="
            adb shell uiautomator dump /sdcard/ui_tmp2.xml
            adb pull /sdcard/ui_tmp2.xml /tmp/ui_tmp2.xml
            COORDS=$(python3 .github/scripts/find_element.py /tmp/ui_tmp2.xml "Continue" || true)
            [ -z "$COORDS" ] && COORDS=$(python3 .github/scripts/find_element.py /tmp/ui_tmp2.xml "Next" || true)
            [ -z "$COORDS" ] && COORDS=$(python3 .github/scripts/find_element.py /tmp/ui_tmp2.xml "I Understand" || true)
            [ -z "$COORDS" ] && COORDS=$(python3 .github/scripts/find_element.py /tmp/ui_tmp2.xml "Agree" || true)
            [ -n "$COORDS" ] && echo ">>> Tapping continue button at $COORDS" && adb shell input tap $COORDS || echo ">>> No continue button found"
            sleep 4

            echo "=== Screenshot 3: After continuing ==="
            adb shell screencap -p /sdcard/screen3.png
            adb pull /sdcard/screen3.png screenshots/03_after_continue.png
            adb shell uiautomator dump /sdcard/ui3.xml
            adb pull /sdcard/ui3.xml screenshots/ui3_after_continue.xml

            echo "=== Pressing back ==="
            adb shell input keyevent 4
            sleep 2

            echo "=== Screenshot 4: After back ==="
            adb shell screencap -p /sdcard/screen4.png
            adb pull /sdcard/screen4.png screenshots/04_after_back.png

            echo "=== Final logcat (last 150 lines) ==="
            adb logcat -d 2>&1 | tail -150 > screenshots/logcat.txt

            echo "=== All screenshots captured! ==="
            ls -la screenshots/

      - name: Upload screenshots and UI dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-ui-test-results
          path: screenshots/
          if-no-files-found: error

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: screenshots/logcat.txt
          if-no-files-found: warn
