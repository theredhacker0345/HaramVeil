name: App UI Test (Emulator)

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor to test (fossOnnx or mlkit)'
        required: false
        default: 'fossOnnx'
  pull_request:
    branches: [main]
    paths:
      - 'app/src/**'
      - '.github/workflows/app-ui-test.yml'

env:
  GRADLE_OPTS: "-Xmx3072m -Dorg.gradle.daemon=false"

jobs:
  emulator-test:
    name: Emulator UI Test (${{ github.event.inputs.flavor || 'fossOnnx' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Enable KVM (required for emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Build ${{ github.event.inputs.flavor || 'fossOnnx' }} debug APK
        env:
          FLAVOR: ${{ github.event.inputs.flavor || 'fossOnnx' }}
        run: |
          FLAVOR_CAP="$(printf '%s' "$FLAVOR" | sed 's/^./\U&/')"
          ./gradlew :app:assemble${FLAVOR_CAP}Debug --no-daemon

      - name: Find APK
        id: apk
        env:
          FLAVOR: ${{ github.event.inputs.flavor || 'fossOnnx' }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/${FLAVOR}/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found"
            exit 1
          fi
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Run emulator + install + interact + screenshot
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_6
          sdcard-path-or-size: 512M
          heap-size: 512M
          ram-size: 2048M
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            mkdir -p screenshots
            adb wait-for-device
            adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
            echo "Boot complete"
            adb install -r -g "$APK_PATH"
            adb logcat -c
            adb shell am start -n com.haramveil/.MainActivity
            sleep 10
            adb shell screencap -p /sdcard/s1.png && adb pull /sdcard/s1.png screenshots/01_welcome_step1.png
            adb shell input tap 540 1921
            sleep 6
            adb shell screencap -p /sdcard/s2.png && adb pull /sdcard/s2.png screenshots/02_capability_step2.png
            adb shell input tap 540 1921
            sleep 5
            adb shell screencap -p /sdcard/s3.png && adb pull /sdcard/s3.png screenshots/03_app_selection_step3.png
            adb shell input tap 540 2150
            sleep 5
            adb shell screencap -p /sdcard/s4.png && adb pull /sdcard/s4.png screenshots/04_security_step4.png
            adb shell input tap 540 2150
            sleep 5
            adb shell screencap -p /sdcard/s5.png && adb pull /sdcard/s5.png screenshots/05_permissions_step5.png
            adb shell input tap 540 2150
            sleep 5
            adb shell screencap -p /sdcard/s6.png && adb pull /sdcard/s6.png screenshots/06_final_step6.png
            adb shell input keyevent 4
            sleep 3
            adb shell screencap -p /sdcard/s7.png && adb pull /sdcard/s7.png screenshots/07_after_back.png
            adb shell am start -n com.haramveil/.MainActivity
            sleep 8
            adb shell screencap -p /sdcard/s8.png && adb pull /sdcard/s8.png screenshots/08_relaunch.png
            adb shell input swipe 540 1500 540 500 300
            sleep 2
            adb shell screencap -p /sdcard/s9.png && adb pull /sdcard/s9.png screenshots/09_scrolled_down.png
            adb shell input swipe 540 500 540 1500 300
            sleep 2
            adb shell screencap -p /sdcard/s10.png && adb pull /sdcard/s10.png screenshots/10_scrolled_up.png
            adb shell input tap 540 150
            sleep 3
            adb shell screencap -p /sdcard/s11.png && adb pull /sdcard/s11.png screenshots/11_top_tap.png
            adb shell input tap 540 2300
            sleep 3
            adb shell screencap -p /sdcard/s12.png && adb pull /sdcard/s12.png screenshots/12_nav_bar_tap.png
            adb logcat -d 2>&1 | tail -200 > screenshots/logcat.txt
            ls -la screenshots/

      - name: Upload screenshots and UI dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-ui-test-results
          path: screenshots/
          if-no-files-found: error

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: screenshots/logcat.txt
          if-no-files-found: warn
