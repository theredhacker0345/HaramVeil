name: App UI Test (Emulator)

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor to test (fossOnnx or mlkit)'
        required: false
        default: 'fossOnnx'
  pull_request:
    branches: [main]
    paths:
      - 'app/src/**'
      - '.github/workflows/app-ui-test.yml'

env:
  GRADLE_OPTS: "-Xmx3072m -Dorg.gradle.daemon=false"

jobs:
  emulator-test:
    name: Emulator UI Test (${{ github.event.inputs.flavor || 'fossOnnx' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Enable KVM (required for emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Build ${{ github.event.inputs.flavor || 'fossOnnx' }} debug APK
        env:
          FLAVOR: ${{ github.event.inputs.flavor || 'fossOnnx' }}
        run: |
          FLAVOR_CAP="$(printf '%s' "$FLAVOR" | sed 's/^./\U&/')"
          ./gradlew :app:assemble${FLAVOR_CAP}Debug --no-daemon

      - name: Find APK
        id: apk
        env:
          FLAVOR: ${{ github.event.inputs.flavor || 'fossOnnx' }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/${FLAVOR}/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found"
            exit 1
          fi
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Run emulator + install + interact + screenshot
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_6
          sdcard-path-or-size: 512M
          heap-size: 512M
          ram-size: 2048M
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            echo "=== Creating screenshots directory ==="
            mkdir -p screenshots

            echo "=== Waiting for boot ==="
            adb wait-for-device
            adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
            echo "=== Boot complete! ==="

            echo "=== Device info ==="
            adb shell getprop ro.product.model
            adb shell getprop ro.build.version.release
            adb shell wm size

            echo "=== Installing APK ==="
            adb install -r -g "$APK_PATH"

            echo "=== Clearing logcat ==="
            adb logcat -c

            # ============================================================
            # Helper: take a screenshot and pull it
            # ============================================================
            take_screenshot() {
              local num="$1"
              local name="$2"
              adb shell screencap -p /sdcard/screenshot_${num}.png
              adb pull /sdcard/screenshot_${num}.png "screenshots/${num}_${name}.png"
              echo ">>> Captured ${num}_${name}.png"
            }

            # ============================================================
            # Helper: dump UI hierarchy and pull it
            # ============================================================
            dump_ui() {
              local num="$1"
              adb shell uiautomator dump /sdcard/ui_${num}.xml
              adb pull /sdcard/ui_${num}.xml "screenshots/ui${num}.xml"
            }

            # ============================================================
            # Launch app and capture onboarding screens
            # ============================================================
            echo "=== Launching HaramVeil app ==="
            adb shell am start -n com.haramveil/.MainActivity
            sleep 10

            # Screenshot 01: Welcome / Step 1 of 6
            take_screenshot 01 "welcome_step1"
            dump_ui 01

            # Tap "Begin Setup" button at (540, 1921)
            echo ">>> Tapping 'Begin Setup' at (540, 1921)"
            adb shell input tap 540 1921
            sleep 6

            # Screenshot 02: Step 2 of 6 — Capability/Benchmark
            take_screenshot 02 "capability_step2"
            dump_ui 02

            # Tap "Confirm Choices" button (bottom of screen, same position)
            echo ">>> Tapping 'Confirm Choices' at (540, 1921)"
            adb shell input tap 540 1921
            sleep 5

            # Screenshot 03: Step 3 of 6 — App Selection
            take_screenshot 03 "app_selection_step3"
            dump_ui 03

            # Tap "Continue" / "Confirm" at bottom
            echo ">>> Tapping bottom button at (540, 2150)"
            adb shell input tap 540 2150
            sleep 5

            # Screenshot 04: Step 4 (could be PIN setup or security)
            take_screenshot 04 "security_step4"
            dump_ui 04

            # Try tapping bottom button again
            echo ">>> Tapping bottom button at (540, 2150)"
            adb shell input tap 540 2150
            sleep 5

            # Screenshot 05: Step 5 (could be permissions review)
            take_screenshot 05 "permissions_step5"
            dump_ui 05

            # Try tapping bottom button again
            echo ">>> Tapping bottom button at (540, 2150)"
            adb shell input tap 540 2150
            sleep 5

            # Screenshot 06: Step 6 (final onboarding step or dashboard)
            take_screenshot 06 "final_step6"
            dump_ui 06

            # ============================================================
            # Try to navigate to Dashboard, Stats, Settings
            # ============================================================

            # Press back to see if we get to dashboard
            echo "=== Pressing back ==="
            adb shell input keyevent 4
            sleep 3

            take_screenshot 07 "after_back"
            dump_ui 07

            # Try relaunching the app (might go to dashboard if onboarding was completed)
            echo "=== Relaunching app ==="
            adb shell am start -n com.haramveil/.MainActivity
            sleep 8

            take_screenshot 08 "relaunch"
            dump_ui 08

            # Try scrolling down to see more of the screen
            echo "=== Scrolling down ==="
            adb shell input swipe 540 1500 540 500 300
            sleep 2

            take_screenshot 09 "scrolled_down"
            dump_ui 09

            # Try scrolling back up
            echo "=== Scrolling up ==="
            adb shell input swipe 540 500 540 1500 300
            sleep 2

            take_screenshot 10 "scrolled_up"
            dump_ui 10

            # Try tapping top-left area (might be navigation menu or back)
            echo "=== Tapping top-left (540, 150) ==="
            adb shell input tap 540 150
            sleep 3

            take_screenshot 11 "top_tap"
            dump_ui 11

            # Try tapping different navigation areas
            echo "=== Tapping bottom-center (540, 2300) — possible nav bar ==="
            adb shell input tap 540 2300
            sleep 3

            take_screenshot 12 "nav_bar_tap"
            dump_ui 12

            # ============================================================
            # Final screenshot + logcat
            # ============================================================
            echo "=== Final logcat (last 200 lines) ==="
            adb logcat -d 2>&1 | tail -200 > screenshots/logcat.txt

            echo "=== All screenshots captured! ==="
            ls -la screenshots/

      - name: Upload screenshots and UI dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-ui-test-results
          path: screenshots/
          if-no-files-found: error

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: screenshots/logcat.txt
          if-no-files-found: warn
