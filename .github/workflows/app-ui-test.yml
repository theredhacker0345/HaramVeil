name: App UI Test (Emulator)

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor to test (fossOnnx or mlkit)'
        required: false
        default: 'fossOnnx'
  pull_request:
    branches: [main]
    paths:
      - 'app/src/**'
      - '.github/workflows/app-ui-test.yml'

env:
  GRADLE_OPTS: "-Xmx3072m -Dorg.gradle.daemon=false"

jobs:
  emulator-test:
    name: Emulator UI Test (${{ github.event.inputs.flavor || 'fossOnnx' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        env:
          FLAVOR: ${{ github.event.inputs.flavor || 'fossOnnx' }}
        run: |
          FLAVOR_CAP="$(printf '%s' "$FLAVOR" | sed 's/^./\U&/')"
          ./gradlew :app:assemble${FLAVOR_CAP}Debug --no-daemon

      - name: Find APK
        id: apk
        env:
          FLAVOR: ${{ github.event.inputs.flavor || 'fossOnnx' }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/${FLAVOR}/debug/ -name "*.apk" | head -n 1)
          [ -z "$APK_PATH" ] && { echo "::error::No APK found"; exit 1; }
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Run emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_6
          sdcard-path-or-size: 512M
          heap-size: 512M
          ram-size: 2048M
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            mkdir -p screenshots
            adb wait-for-device
            adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
            echo "Boot complete"
            adb install -r -g "$APK_PATH"
            adb logcat -c
            echo "=== Launching app ==="
            adb shell am start -n com.haramveil/.MainActivity
            sleep 10
            echo "=== Screenshot 1: Welcome (Step 1) ==="
            adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png screenshots/1_welcome.png
            echo "=== Tap Begin Setup ==="
            adb shell input tap 540 1921
            sleep 5
            echo "=== Screenshot 2: Benchmark running (Step 2) ==="
            adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png screenshots/2_benchmark_running.png
            echo "=== Wait 90s for benchmark to finish ==="
            sleep 90
            echo "=== Screenshot 3: Benchmark done (Step 2) ==="
            adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png screenshots/3_benchmark_done.png
            echo "=== Tap Confirm Choices ==="
            adb shell input tap 540 1921
            sleep 5
            echo "=== Screenshot 4: App selection (Step 3) ==="
            adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png screenshots/4_app_selection.png
            echo "=== Tap Continue (bottom center) ==="
            adb shell input tap 540 2150
            sleep 5
            echo "=== Screenshot 5: Next step ==="
            adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png screenshots/5_next_step.png
            echo "=== Tap Continue ==="
            adb shell input tap 540 2150
            sleep 5
            echo "=== Screenshot 6: Next step ==="
            adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png screenshots/6_next_step.png
            echo "=== Tap Continue ==="
            adb shell input tap 540 2150
            sleep 5
            echo "=== Screenshot 7: Next step ==="
            adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png screenshots/7_next_step.png
            echo "=== Tap Continue ==="
            adb shell input tap 540 2150
            sleep 5
            echo "=== Screenshot 8: Next step or dashboard ==="
            adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png screenshots/8_dashboard_or_final.png
            echo "=== Scroll down ==="
            adb shell input swipe 540 1800 540 400 500
            sleep 2
            echo "=== Screenshot 9: Scrolled ==="
            adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png screenshots/9_scrolled.png
            echo "=== Press back ==="
            adb shell input keyevent 4
            sleep 3
            echo "=== Screenshot 10: After back ==="
            adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png screenshots/10_after_back.png
            adb logcat -d 2>&1 | tail -200 > screenshots/logcat.txt
            ls -la screenshots/

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-ui-test-results
          path: screenshots/
          if-no-files-found: error
