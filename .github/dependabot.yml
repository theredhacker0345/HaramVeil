version: 2
updates:
  # GitHub Actions — group ALL action updates into a single PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      actions:
        patterns:
          - "actions/*"
          - "gradle/*"
          - "mikepenz/*"
          - "softprops/*"

  # Gradle dependencies — group ALL gradle updates into a single PR
  # and separate Kotlin/AGP major bumps into their own PR for careful review
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "gradle"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # All AndroidX and Compose updates in one PR
      androidx:
        patterns:
          - "androidx.*"
          - "com.google.android.material"
      # All Kotlin-related updates in one PR
      kotlin:
        patterns:
          - "org.jetbrains.kotlin.*"
          - "org.jetbrains.kotlinx.*"
      # Other libraries (ONNX, Coil, SQLCipher, bcrypt, etc.) in one PR
      libraries:
        patterns:
          - "com.microsoft.onnxruntime.*"
          - "io.coil-kt.*"
          - "net.zetetic.*"
          - "at.favre.lib.*"
